name: security
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *" # Tous les jours à midi. Dans l'ordre : minute (0-59) -heure (0-23) -jour du mois (1-31) -mois (1-12) -jour de la semaine (0-6 (dimanche=0))
jobs:
  security:
    name: audit node
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy scanner without cache
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          cache: "false"
      - name: Run compose
        run: docker compose -f docker-compose.yml up -d
      - name: Run trivy
        run: trivy image dilolabs/nosia:latest && trivy image caddy:latest && trivy image pgvector/pgvector:pg16
